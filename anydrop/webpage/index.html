<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>anydrop ⚡</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* Default: Dark Theme */
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-color: #238636;
            --accent-hover: #2ea043;
            --disabled-color: #21262d;
        }

        @media (prefers-color-scheme: light) {
            :root {
                /* Automatic Light Theme if user's OS is set to light */
                --bg-color: #ffffff;
                --card-bg: #f6f8fa;
                --border-color: #e1e4e8;
                --text-primary: #24292e;
                --text-secondary: #586069;
                --accent-color: #2ea44f;
                --accent-hover: #2c974b;
                --disabled-color: #d1d5da;
            }
        }
        
        body {
            background-color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            width: 100dvw;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .main-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 420px;
            margin: 0 16px;
            padding: 32px 24px;
            gap: 24px;
            border-radius: 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .file-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .file-name {
            color: var(--text-primary);
            font-size: 1.1rem;
            font-weight: 600;
            word-break: break-all;
            text-align: center;
        }

        .status-text {
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-align: center;
            min-height: 1.2em;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background-color: var(--accent-color);
            transition: width 0.15s ease-out;
        }

        .download-btn {
            width: 100%;
            padding: 12px 16px;
            cursor: pointer;
            background-color: var(--accent-color);
            color: #ffffff;
            border-radius: 8px;
            border: none;
            transition: background-color 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
        }

        .download-btn span {
            font-size: 0.95rem;
            font-weight: 600;
            display: block;
            text-align: center;
        }

        .download-btn:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        .download-btn:active:not(:disabled) {
            background-color: var(--accent-hover);
            transform: scale(0.98);
        }

        .download-btn:disabled {
            background-color: var(--disabled-color);
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="main-card">
        <div class="file-info">
            <!-- Dynamically populated or injected filename -->
            <span class="file-name" id="fileName">shared_file.zip</span>
            <span class="status-text" id="statusText">Ready to download</span>
        </div>

        <div class="progress-track" id="progressTrack">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <button class="download-btn" id="downloadBtn" onclick="downloadFile()">
            <span id="btnText">Download</span>
        </button>
    </div>

    <script>
        function downloadFile() {
            const statusText = document.getElementById('statusText');
            const progressFill = document.getElementById('progressFill');
            const downloadBtn = document.getElementById('downloadBtn');
            const btnText = document.getElementById('btnText');

            // Path corresponding to Axum tower-http ServeDir route (/files/<filename>)
            const fileUrl = `/download`;

            // Disable button during active download
            downloadBtn.disabled = true;
            btnText.innerText = 'Downloading...';
            statusText.innerText = 'Starting download...';
            progressFill.style.width = '0%';

            const xhr = new XMLHttpRequest();
            xhr.open('GET', fileUrl, true);
            // Request response as Blob so we can save it directly
            xhr.responseType = 'blob';

            // Track GET download progress
            xhr.onprogress = function (event) {
                if (event.lengthComputable) {
                    const percentComplete = Math.round((event.loaded / event.total) * 100);
                    progressFill.style.width = percentComplete + '%';
                    
                    // Format readable sizes
                    const loadedMB = (event.loaded / (1024 * 1024)).toFixed(1);
                    const totalMB = (event.total / (1024 * 1024)).toFixed(1);
                    statusText.innerText = `${percentComplete}% (${loadedMB} MB / ${totalMB} MB)`;
                } else {
                    // Fallback for servers not sending Content-Length header
                    statusText.innerText = 'Downloading...';
                }
            };

            // Handle completion
            xhr.onload = function () {
                if (xhr.status === 200) {
                    statusText.innerText = 'Download complete!';
                    btnText.innerText = 'Completed';
                    progressFill.style.width = '100%';

                    // Create blob object URL and trigger browser save prompt
                    const blob = xhr.response;
                    const blobUrl = window.URL.createObjectURL(blob);
                    
                    const anchor = document.createElement('a');
                    anchor.style.display = 'none';
                    anchor.href = blobUrl;
                    anchor.download = fileName;
                    document.body.appendChild(anchor);
                    
                    anchor.click();

                    // Cleanup temporary DOM element and memory object URL
                    setTimeout(() => {
                        document.body.removeChild(anchor);
                        window.URL.revokeObjectURL(blobUrl);
                        downloadBtn.disabled = false;
                        btnText.innerText = 'Download Again';
                    }, 1000);
                } else {
                    statusText.innerText = `Download failed (Server status: ${xhr.status})`;
                    btnText.innerText = 'Retry Download';
                    downloadBtn.disabled = false;
                }
            };

            // Handle network errors
            xhr.onerror = function () {
                statusText.innerText = 'Network error occurred during download.';
                btnText.innerText = 'Retry Download';
                downloadBtn.disabled = false;
            };

            xhr.send();
        }
    </script>
</body>
</html>
